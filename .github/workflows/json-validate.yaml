name: Validate JSON

on:
  pull_request:
    paths:
      - "indieweb-projects.json"
      - ".github/workflows/json-validate.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate indieweb-projects.json
        run: |
          node -e "JSON.parse(require('fs').readFileSync('indieweb-projects.json', 'utf8')); console.log('Valid JSON: indieweb-projects.json');"
